<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>For Daniel ♡</title>
<style>
/* Layout: one-screen arcade quiz. HUD on top, question card in the middle, a typed answer field below. */
:root{
  --night:#120a2e; --night2:#2a0f4a; --ink:#fff6e8; --muted:#c7b8ef;
  --sun:#ffcf3f; --pink:#ff4f9a; --mint:#3ff5c4; --sky:#4fb8ff; --red:#ff3b3b;
  --display:"Bungee",Impact,system-ui,sans-serif; --shade:"Bungee Shade","Bungee",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;background:var(--night);
  background-image:radial-gradient(60% 50% at 85% 8%,#ff4f9a55,transparent 70%),radial-gradient(55% 45% at 10% 90%,#4fb8ff55,transparent 70%),radial-gradient(80% 70% at 50% 50%,var(--night2),var(--night));overflow-x:hidden}
#sky{position:fixed;inset:0;pointer-events:none}
.wrap{position:relative;min-height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-inline:16px;padding-block:16px;box-sizing:border-box}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:#ffffff1f;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--sun),var(--mint),var(--sky));transition:width .5s}
.screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(30px) scale(.95);opacity:0}}
.big{font-family:var(--shade);font-weight:400;font-size:clamp(2rem,10vw,3rem);line-height:1;margin:0;color:var(--sun);text-shadow:0 3px 0 var(--pink),0 8px 18px #0008;text-align:center;text-wrap:balance}
.sub{text-align:center;line-height:1.5;font-weight:600;margin:0}
.small{text-align:center;font-size:.8rem;color:var(--muted);margin:0}
.qcard{color:#1d1530;border-radius:14px;padding:16px;border:6px solid transparent;
  background:linear-gradient(170deg,#fff3c4,#ffc8e2) padding-box,conic-gradient(from var(--a,0deg),#ff4f9a,#ffcf3f,#3ff5c4,#4fb8ff,#a46bff,#ff4f9a) border-box;animation:spin 6s linear infinite;box-shadow:0 18px 40px #000a}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.qnum{font-family:var(--display);font-size:.75rem;color:#7a3cff}
.q{font-weight:900;font-size:1.15rem;line-height:1.3;margin:6px 0 8px;text-wrap:balance}
.hintline{display:inline-block;font-weight:800;font-size:.8rem;background:#2a0f4a;color:var(--sun);border-radius:999px;padding:4px 10px}
form{display:flex;flex-direction:column;gap:10px}
input{font-family:var(--body);font-weight:800;font-size:1.1rem;color:var(--ink);background:#ffffff14;border:0;border-radius:12px;padding:14px 16px;box-shadow:inset 0 0 0 2px #ffffff40;outline:none;width:100%;box-sizing:border-box}
input:focus{box-shadow:inset 0 0 0 2px var(--sun),0 0 18px #ffcf3f55}
input.wrong{box-shadow:inset 0 0 0 2px var(--red);animation:shake .4s}
input.right{box-shadow:inset 0 0 0 2px var(--mint),0 0 24px var(--mint)}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.toast{text-align:center;font-weight:800;min-height:2.8em;line-height:1.4}
.toast.bad{color:#ff8fa8}.toast.good{color:var(--mint)}
.btn{font-family:var(--display);font-size:1rem;border:0;border-radius:999px;padding:14px 26px;background:var(--sun);color:#2a0f4a;cursor:pointer;box-shadow:0 5px 0 #c4502c;align-self:center}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c4502c}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.lock{width:96px;height:96px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:3rem;background:radial-gradient(circle at 35% 30%,#fff,var(--sun) 40%,var(--pink));box-shadow:0 0 0 5px var(--night),0 0 0 9px var(--sun),0 0 40px var(--pink);animation:float 2.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.tv{background:#0c0620;border-radius:16px;padding:16px;box-shadow:inset 0 0 0 3px #ffffff22,0 18px 40px #000a;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.play{width:74px;height:52px;border-radius:14px;background:var(--red);display:grid;place-items:center;box-shadow:0 0 30px #ff3b3b88;animation:pulse 1.4s ease-in-out infinite}
.play::after{content:"";border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
@keyframes pulse{50%{transform:scale(1.08)}}
.clock{font-family:var(--display);font-size:clamp(1.8rem,9vw,2.4rem);color:var(--sun);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.burst{position:fixed;pointer-events:none;font-size:1.4rem;animation:fly 1.5s ease-out forwards;z-index:9}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="wrap">
  <div class="hud"><span id="lvl">Level 1</span><span id="prog">0/11</span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="screen" id="screen"></div>
</div>

<script>
const WRONG="bravo keep breaking my heart more than the distance is already breaking it 🥲";
const Q=[
 {q:"On what date did we first talk?",h:"1 date · 8 numbers · DD/MM/YYYY",ok:["27082026","2782026","27august2026","27aug2026"]},
 {q:"What time was the first time you saw Marita?",h:"1 word · 5 characters (3 numbers + am/pm)",ok:["529pm","1729","529"]},
 {q:"What time did you first message Marita in your life?",h:"1 word · 5 characters (3 numbers + am/pm)",ok:["644pm","1844","644"]},
 {q:"What was the first sentence you ever sent to Marita?",h:"15 words · 50 letters",ok:["iwanttoletyouknowimgoingtowoopyouonthetenniscourts","iwanttoletyouknowimgoingtowhoopyouonthetenniscourts","iwanttoletyouknowiamgoingtowoopyouonthetenniscourts","iwanttoletyouknowiamgoingtowhoopyouonthetenniscourts"]},
 {q:"How long did our first call last?",h:"2 words · 5 characters (1 number + 4 letters)",ok:["1hour","onehour","1hr","60minutes","60mins","60min"]},
 {q:"How often should you check the YouTube channel?",h:"1 word · 8 letters",ok:["everyday"]},
 {q:"What was the first nickname I called you?",h:"2 words · 16 letters",ok:["arrogantprincess"]},
 {q:"What's the song I stole from you?",h:"1 word · 7 letters",ok:["roxanne"]},
 {q:"What's my favourite fruit?",h:"1 word · 11 letters",ok:["pomegranate","pomegranates"]},
 {q:"What was my reply to the first message you ever sent me?",h:"4 words · 13 letters (punctuation and emojis don't count)",ok:["heyyimfinehby","heyyiamfinehby"]},
 {q:"Final boss. When exactly did you ask me to be your girlfriend?",h:"6 words · 29 characters · weekday, date, month & time",final:true,
  test:s=>s.includes("sun")&&s.includes("13")&&s.includes("sep")&&s.includes("1237")}
];
let i=0;
const $=id=>document.getElementById(id),scr=$('screen');
const norm=s=>s.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9]/g,"");
function hud(){$('prog').textContent=i+'/'+Q.length;$('bar').style.width=(i/Q.length*100)+'%'}

const cv=$('sky'),cx=cv.getContext('2d');let st=[];
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;st=Array.from({length:80},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.6+.3,p:Math.random()*6.28}))}
size();addEventListener('resize',size);
(function tw(t){cx.clearRect(0,0,cv.width,cv.height);for(const s of st){cx.globalAlpha=.35+.65*Math.abs(Math.sin(t/900+s.p));cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,s.r*devicePixelRatio,0,6.28);cx.fill()}requestAnimationFrame(tw)})(0);

function burst(n){for(let k=0;k<n;k++){const s=document.createElement('span');s.className='burst';s.textContent=['♡','✦','❤','★','✧'][k%5];
  s.style.left='50%';s.style.top='40%';s.style.color=['#ff4f9a','#ffcf3f','#3ff5c4','#4fb8ff','#fff'][k%5];
  const a=Math.random()*6.28,d=110+Math.random()*190;s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');s.style.setProperty('--r',Math.random()*540+'deg');
  document.body.appendChild(s);setTimeout(()=>s.remove(),1600)}}

function intro(){
  hud();
  scr.innerHTML=`<div class="screen"><div class="lock">🔓</div><h1 class="big">Level 1 Unlocked</h1>
  <p class="sub">You've been my boyfriend for one whole month. To pass Level 1, type the right answer to every question. Get one wrong and you're stuck until you get it right.</p>
  <p class="small">The brackets tell you how many words and letters each answer has.</p>
  <button class="btn" id="go">Press Start</button></div>`;
  $('go').onclick=ask;
}
function ask(){
  hud();const x=Q[i];
  scr.innerHTML=`<div class="screen"><div class="qcard"><div class="qnum">${x.final?'★ Final question':'Question '+(i+1)+' of '+Q.length}</div>
  <p class="q">${x.q}</p><span class="hintline">(${x.h})</span></div>
  <form id="f" autocomplete="off"><input id="a" placeholder="Type your answer…" aria-label="Your answer" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="btn" type="submit">Submit</button></form>
  <div class="toast" id="toast"></div></div>`;
  const inp=$('a');inp.focus();
  $('f').onsubmit=e=>{e.preventDefault();const v=norm(inp.value);if(!v)return;
    const right=x.test?x.test(v):x.ok.includes(v);
    if(right){inp.classList.remove('wrong');inp.classList.add('right');inp.disabled=true;
      const t=$('toast');t.className='toast good';t.textContent=x.final?'YES. 12:37 PM. The best minute of my year.':'Correct! ♡';burst(x.final?40:14);
      setTimeout(()=>{i++;i<Q.length?ask():win()},x.final?1800:1100);}
    else{inp.classList.remove('wrong');void inp.offsetWidth;inp.classList.add('wrong');const t=$('toast');t.className='toast bad';t.textContent=WRONG;}
  };
}
function target(){return new Date(2026,9,13,12,37,0)} // 13 Oct 2026, 12:37 PM on his own clock
function win(){
  i=Q.length;hud();$('lvl').textContent='Level 1 Complete';
  scr.innerHTML=`<div class="screen"><h1 class="big">Level 1 Complete!</h1>
  <p class="sub">Sunday 13th of September, 12:37 PM. You asked, I said yes. Screenshot this and send it to Marita to unlock Level 2.</p>
  <div class="tv"><div class="lock" style="width:64px;height:64px;font-size:2rem">🏆</div>
    <div class="small">Achievement unlocked</div><div class="clock" style="font-size:1.4rem">Certified Boyfriend</div>
    <p class="sub">11/11 correct · 47 days · 13,811 km · 1 month</p>
    <p class="small">Reward: Marita. Forever. Non-refundable.</p></div>
  <p class="small">Happy one month, angel Daniel. ♡ Marita</p></div>`;
  burst(40);
}
function tick(){
  const el=$('clock');if(!el)return;let ms=target()-new Date();
  if(ms<=0){el.textContent="IT'S 12:37";$('cue').innerHTML='It\'s time. ♡';return;}
  const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);
  el.textContent=[h,m,s].map(n=>String(n).padStart(2,'0')).join(':');
}
intro();
</script>
</body>
</html>
